function nav(){const section=(location.hash.slice(1)||'home').split('/')[0];const items=[['home','Accueil','home'],...(admin()?[['materials','Matériels','box'],['rooms','Salles','room']]:[]),...(canViewStages()?[['stages','Stages','stage']]:[]),...(canSupervise()?[['supervision','Supervision','chart']]:[]),...(role!=='Stagiaire'?[['alerts','Alertes','alert']]:[]),...(role==='Administrateur'?[['users','Utilisateurs','users']]:[])];$('#sidebar').innerHTML=`<div class="brand">SESAM<small>GESTION DES RESSOURCES</small></div><nav class="nav">${items.map(([r,l,i])=>`<a href="#${r}" class="${section===r?'active':''}" title="${l}">${icon(i)}<span>${l}</span></a>`).join('')}</nav><div class="sidebottom">CENTRE DE FORMATION<br>Environnement de démonstration<br>Version 1.0 · Octobre 2026</div>`;$('#header').innerHTML=`<strong>${items.find(i=>i[0]===section)?.[1]||'SESAM'}</strong><div class="profile"><a href="#${role==='Stagiaire'?'home':'alerts'}" class="btn small" aria-label="Consulter les alertes">${icon('alert')} ${alerts.filter(a=>a.status==='En attente'&&(role!=='Stagiaire'||a.author==='Lucas Martin')).length}</a><span class="avatar">${role==='Stagiaire'?'LM':'MG'}</span><label>Tester un rôle<select id="role">${opts(['Gestionnaire','Administrateur','Formateur','Stagiaire'],role)}</select></label></div>`}

 const signalements=`<section class="panel" id="home-alerts"><div class="panel-title">${trainee?'Mes alertes et signalements':'Signalements de la salle'} ${trainee?'':`<a href="#alerts" class="subtle">Voir les alertes</a>`}</div>${myAlerts.map(a=>`<div class="listitem"><span class="iconbox">${icon('alert')}</span><div style="flex:1;min-width:0"><strong>${esc(a.type)}</strong><p class="subtle" style="margin:6px 0">${esc(a.description)}</p><div class="subtle">${a.ids.map(id=>`<a href="#materials/${esc(id)}">${esc(id)}</a>`).join(', ')} · ${a.date}</div></div>${badge(a.status)}</div>`).join('')||'<div class="empty">Aucun signalement pour le moment.</div>'}</section>`;
 const stageCard=myStage?`<section class="panel"><div class="panel-title">Mon stage ${badge(myStage.status)}</div><div class="panel-body"><h2 style="margin:0 0 20px;font-size:23px">${esc(myStage.name)}</h2>${info([['Dates',`${date(myStage.start)} – ${date(myStage.end)}`],['Formation',esc(myStage.type)],['Chef de section',esc(myStage.chief)],['Salle',esc(roomName(myStage.room))],['Bâtiment',esc(room(myStage.room)?.building||'—')]])}</div></section>`:'<section class="panel empty">Aucun stage affecté.</section>';
 const equipment=`<section class="panel"><div class="panel-title">${trainee?'Mes matériels':'Matériels de la salle'} <span class="pillnum">${mine.length}</span>${trainee?'':`<a class="subtle" href="#supervision">Superviser les matériels</a>`}</div>${mine.map(m=>`<div class="listitem"><span class="iconbox">${icon(m.type==='UC'?'room':'box')}</span><div class="name">${esc(m.name)}<small>${m.id} · ${esc(roomName(m.room))} · ${esc(room(m.room)?.building||'')}</small></div><a class="right" href="#materials/${m.id}">Fiche descriptive</a></div>`).join('')||'<div class="empty">Aucun matériel affecté.</div>'}</section>`;
 return heading('Accueil',trainee?'Votre formation et vos matériels.':'Suivi des matériels et signalements de votre salle.',btn('Signaler un problème','report','','primary','alert'))+(trainee?`<div class="columns">${stageCard}${equipment}</div>${signalements}`:`${equipment}${signalements}`);
}

le ou clôturer un stage.','stage'],['supervision','Supervision des postes','Consulter les connexions et les processus.','chart']]:[['rooms/A101','Salle A101','Retrouver les matériels de votre salle.','room'],['alerts','Mes signalements','Suivre les problèmes signalés.','alert']]).map(([r,t,s,i])=>`<a href="#${r}" class="card"><div class="card-top"><span class="iconbox">${icon(i)}</span><div><h3>${t}</h3><div class="subtle">${s}</div></div></div></a>`).join('')}</div>`}` }
function materialsPage(){if(!admin())return denied();let list=materials.filter(m=>(!filters.q||`${m.id} ${m.name} ${m.brand}`.toLowerCase().includes(filters.q.toLowerCase()))&&(!filters.type||m.type===filters.type)&&(!filters.status||m.status===filters.status)&&(!filters.room||m.room===filters.room)&&(!filters.loc||m.location===filters.loc));let pages=Math.max(1,Math.ceil(list.length/8));page=Math.min(page,pages);return heading('Matériels','Rechercher et gérer les matériels du centre.',(admin()?btn('Affecter du matériel','transfer','','','room'):'')+(admin()?btn('Ajouter un matériel','material-form','','primary','plus'):''))+`<section class="panel"><div class="filters">${search('Nom, numéro de série, marque…')}${selectFilter('Type','type',['UC','Écran','Projecteur'])}${selectFilter('État','status',['Disponible','En maintenance'])}${selectFilter('Salle','room',rooms.map(r=>[r.id,r.name]))}${selectFilter('Localisation','loc',[...new Set(materials.map(m=>m.location))])}${resetFilters()}</div>${table(['N° de série','Nom','Type','État','Salle','Localisation','Actions'],list.slice((page-1)*8,page*8).map(m=>`<tr><td><a href="#materials/${m.id}">${m.id}</a></td><td class="name"><a href="#materials/${m.id}">${esc(m.name)}</a></td><td>${m.type}</td><td>${badge(m.status)}</td><td>${esc(roomName(m.room))}</td><td>${esc(m.location)}</td><td><a class="btn small" href="#materials/${m.id}" aria-label="Consulter ${m.id}">${icon('eye')}</a></td></tr>`))}<div class="count"><span>${list.length} matériel${list.length!==1?'s':''}</span><div class="actions">${btn('Précédent','prev','','small')}<span>Page ${page} / ${pages}</span>${btn('Suivant','next',pages,'small')}</div></div></section>`}
function materialDetail(id){

function roomsPage(){if(!admin())return denied();let list=rooms.filter(r=>roomAccess(r.id)&&(!filters.q||r.name.toLowerCase().includes(filters.q.toLowerCase()))&&(!filters.type||r.type===filters.type)&&(!filters.building||r.building===filters.building)&&(!filters.status||r.status===filters.status));return heading(admin()?'Salles':'Ma salle','Retrouvez les équipements et la disponibilité des salles.',admin()?btn('Ajouter une salle','room-form','','primary','plus'):'')+`<div class="panel"><div class="filters">${search('Rechercher une salle…')}${selectFilter('Type','type',['Salle de cours','Salle informatique','Stockage'])}${selectFilter('Bâtiment','building',['Bâtiment A','Bâtiment B'])}${selectFilter('État','status',['Disponible','Non disponible','Réinstallation en cours'])}${resetFilters()}</div></div><div class="cards">${list.map(r=>`<article class="card"><div class="card-top"><span class="iconbox">${icon('room')}</span><div><h3><a href="#rooms/${r.id}">${esc(r.name)}</a></h3><div class="subtle">${esc(r.building)} · ${esc(r.location)}</div></div></div>${badge(r.status)}<div class="card-bottom"><span>${pcs(r.id).length} postes · ${r.capacity||'—'} places</span><a href="#rooms/${r.id}">Consulter</a></div></article>`).join('')}</div>${!list.length?'<div class="empty">Aucune salle ne correspond aux critères.</div>':''}`}
function roomDetail(id){if(!admin())return denied();const r=room(id);if(!r)return missing();if(!roomAccess(id))return denied();const all=materials.filter(m=>m.room===id);let list=all.filter(m=>role!=='Stagiaire'||canReport(m));return `<a class="back" href="#rooms">‹ Retour aux salles</a><section class="panel"><div class="panel-body roomhero"><span class="iconbox">${icon('room')}</span><div><h2>${esc(r.name)}</h2><div class="subtle">${esc(r.building)} · ${esc(r.location)} · ${r.type}</div></div><div class="actions">${badge(r.status)}${canManage()?btn('Lancer la réinstallation','reinstall',id,r.status==='Réinstallation en cours'?'':'primary','refresh').replace('<button',r.status==='Réinstallation en cours'?'<button disabled':'<button'):''}${role==='Formateur'?btn('Signaler un problème','report','','','alert'):''}</div></div></section>${r.status==='Réinstallation en cours'?'<div class="notice">Réinstallation en cours — une seconde demande est bloquée. Cette opération est simulée.</div>':''}${r.failed?`<div class="notice error">Postes injoignables : ${esc(r.failed)}. La réinstallation se poursuit sur les autres postes.</div>`:''}<div class="stats"><div class="stat"><label>Postes de la salle</label><strong>${pcs(id).length}</strong></div><div class="stat"><label>Postes connectés</label><strong>${pcs(id).filter(p=>p.online).length}</strong></div><div class="stat"><label>Capacité</label><strong>${r.capacity||'—'}</strong></div><div class="stat"><label>Dernière réinstallation</label><strong style="font-size:20px;margin-top:17px">${r.last}</strong></div></div>${roomStages(id)}<div class="heading"><h2 class="sectiontitle" style="margin:0">Matériels de la salle <span class="pillnum">${list.length}</span></h2><div class="actions">${admin()?btn('Affecter du matériel','transfer-room',id,'','plus'):''}${canSupervise()?link('Superviser les postes',`supervision?room=${id}`):''}</div></div><div class="cards">${list.map(m=>`<article class="card"><div class="card-top"><span class="iconbox">${icon(m.type==='UC'?'room':'box')}</span><div><h3><a href="#materials/${m.id}">${esc(m.name)}</a></h3><div class="subtle">${m.id} · ${esc(m.location)}</div></div></div>${m.type==='UC'?`<div class="health ${m.online?'':'off'}">${m.online?'Connecté':'Hors ligne'}</div><div class="subtle" style="margin-top:8px">${esc(m.user)}</div>`:badge(m.status)}<div class="card-bottom"><span>${m.type}</span><a href="#materials/${m.id}">Fiche descriptive</a></div></article>`).join('')}</div>${!list.length?'<div class="panel empty"><strong>Aucun matériel dans cette salle</strong>Affectez du matériel pour équiper la salle.</div>':''}`}
function stagesPage(){if(!canViewStages())return denied();let list=stages.filter(s=>(!filters.q||s.name.toLowerCase().includes(filters.q.toLowerCase()))&&(!filters.status||s.status===filters.status));return heading('Gestion des stages','Stages chargés depuis SAGAIE et formations du centre.',canViewStages()?btn('Charger / créer un stage','stage-form','','primary','plus'):'')+`<section class="panel"><div class="filters">${search('Rechercher un stage…')}${selectFilter('Statut','status',['À affecter','Affecté','En cours','Clôturé'])}${resetFilters()}</div>${table(['Nom du stage','Dates','Formation','Salle','Statut','Action'],list.map(s=>`<tr><td class="name">${esc(s.name)}<small>${s.source}</small></td><td>${date(s.start)} – ${date(s.end)}</td><td><span class="badge blue">${s.type}</span></td><td>${s.room?esc(roomName(s.room)):'—'}</td><td>${badge(s.status)}</td><td><div class="actions">${link('Voir',`stages/${s.id}`,'small')}${s.status==='À affecter'?btn('Affecter le stage à une salle','assign-stage',s.id,'small'):''}</div></td></tr>`))}<div class="count">${list.length} stages</div></section>`}
function stageDetail(id){if(!canViewStages())return denied();const s=stage(id);if(!s)return missing();return `<a class="back" href="#stages">‹ Retour aux stages</a>`+heading(esc(s.name),`${s.source} · ${s.id}`,badge(s.status)+(role==='Administrateur'&&s.status!=='Clôturé'?btn('Affecter des stagiaires','assign-trainees',id,'primary','plus'):''))+`${s.status==='Clôturé'?`<div class="notice">Ce stage est clôturé et n’est plus modifiable. Salle et postes libérés.${s.closedAt?` Clôturé par ${esc(s.closedBy)} le ${s.closedAt}.`:''}</div>`:''}${s.status==='Clôturé'&&s.notified===false?`<div class="notice warning">SAGAIE n’a pas pu être notifié. La clôture est conservée. ${btn('Réessayer','retry',id,'small')}</div>`:''}<div class="columns"><section class="panel"><div class="panel-title">Informations du stage</div><div class="panel-body">${info([['Nom du stage',esc(s.name)],['Dates',`${date(s.start)} – ${date(s.end)}`],['Type de formation',s.type],['Chef de section',esc(s.chief)],['Stagiaires',stagePeople(s.id,'Stagiaire')],['Formateurs',stagePeople(s.id,'Formateur')],['Origine',s.source]])}</div></section><section class="panel"><div class="panel-title">Ressources affectées</div><div class="panel-body">${s.room?`<div class="card-top"><span class="iconbox">${icon('room')}</span><div><h3><a href="#rooms/${s.room}">${esc(roomName(s.room))}</a></h3><div class="subtle">${room(s.room).building} · ${pcs(s.room).length} postes</div></div></div>${badge('Affecté')}`:`<div class="empty"><strong>${s.status==='Clôturé'?'Ressources libérées':'Aucune salle affectée'}</strong>${s.status==='Clôturé'?'La salle est de nouveau disponible.':'Affectez une salle libre sur la période du stage.'}</div>`}${s.status==='Clôturé'&&s.notified?'<div class="notice" style="margin-top:20px">Notification SAGAIE transmise (simulation).</div>':''}</div></section></div>${s.status==='À affecter'?`<div class="actions">${btn('Affecter le stage à une salle','assign-stage',id,'primary','room')}</div>`:''}${canManage()?`<div class="actions">${btn('Affecter à une salle','assign-stage',id,s.status==='À affecter'?'primary':'','room').replace('<button',s.status==='À affecter'&&s.source==='SAGAIE'?'<button':'<button disabled')}${btn('Clôturer le stage','close-stage',id,s.status==='En cours'?'danger':'').replace('<button',s.status==='En cours'&&s.source==='SAGAIE'?'<button':'<button disabled')}</div><p class="subtle">L’affectation est réservée aux stages SAGAIE non affectés. La clôture est réservée aux stages SAGAIE en cours.</p>`:''}`}
function supervision(){
 if(!canSupervise())return denied();
 const rid=role==='Administrateur'?(filters.room||''):trainerRoom();
 if(role==='Formateur'&&!room(rid))return heading('Supervision','Matériels de votre stage.')+'<section class="panel empty"><strong>Aucune salle affectée à votre stage</strong>Les matériels apparaîtront lorsque le stage sera affecté à une salle.</section>';
 const roomSelector=`<label>Salle<select data-filter="room">${opts([['','Choisir une salle…'],...rooms.filter(r=>r.type!=='Stockage').map(r=>[r.id,r.name])],rid)}</select></label>`;
 if(role==='Administrateur'&&!room(rid))return heading('Supervision','Choisissez une salle pour consulter ses matériels.')+`<section class="panel"><div class="filters">${roomSelector}</div><div class="empty"><strong>Aucune salle sélectionnée</strong>Sélectionnez une salle pour afficher ses matériels. Une seule salle est supervisée à la fois.</div></section>`;
 const inventory=materials.filter(m=>m.room===rid);
 const list=inventory.filter(m=>(!filters.q||`${m.name} ${m.id} ${m.brand}`.toLowerCase().includes(filters.q.toLowerCase()))&&(!filters.type||m.type===filters.type)&&(!filters.material||m.id===filters.material)&&(!filters.state||(filters.state==='Connecté'?m.type==='UC'&&m.online:filters.state==='Hors ligne'?m.type==='UC'&&!m.online:m.status===filters.state)));
 return heading('Supervision','Consulter les matériels de la salle et superviser les postes.',btn('Actualiser','refresh','','','refresh'))+`<section class="panel"><div class="filters">${admin()?roomSelector:`<div class="name">${esc(roomName(rid))} · ${esc(room(rid)?.building||'')}</div>`}${search('Nom ou numéro de série…')}${selectFilter('Type de matériel','type',[...new Set(inventory.map(m=>m.type))])}${selectFilter('Matériel','material',inventory.map(m=>[m.id,`${m.name} · ${m.id}`]))}${selectFilter('État','state',['Disponible','En maintenance','Connecté','Hors ligne'])}${resetFilters()}<label class="checks" style="flex-direction:row;align-items:center"><input type="checkbox" id="auto" ${filters.auto?'checked':''}>Actualisation automatique</label></div></section><div class="heading"><div><h2 style="font-size:20px;margin:0">${esc(roomName(rid))}</h2><p class="subtle">${esc(room(rid)?.building||'')} · ${list.length} matériel${list.length!==1?'s':''}${refreshTime?' · Actualisé à '+refreshTime:''}</p></div></div><div class="cards">${list.map(m=>`<article class="card"><div class="card-top"><span class="iconbox">${icon(m.type==='UC'?'room':'box')}</span><div><h3><a href="#materials/${m.id}">${esc(m.name)}</a></h3><span class="subtle">${esc(m.id)} · ${m.type}</span></div></div>${badge(m.status)}${m.type==='UC'?`<div class="health ${m.online?'':'off'}" style="margin-top:14px">${m.online?'Connecté':'Hors ligne'}</div><p class="subtle">Utilisateur : ${esc(m.user)}</p><div class="subtle">${esc(m.ip)}</div>`:`<p class="subtle">${esc(m.brand)} · ${esc(m.model)}</p>`}<div class="card-bottom"><a href="#materials/${m.id}">Fiche descriptive</a>${m.type==='UC'?`<a href="#supervision/${m.id}">Processus</a>`:''}</div></article>`).join('')}</div>${!list.length?'<div class="panel empty"><strong>Aucun matériel correspondant</strong>Modifiez ou réinitialisez les critères de recherche.</div>':''}`;

function processes(id){const m=mat(id);if(!m||m.type!=='UC')return missing();if(!canSupervise()||!roomAccess(m.room))return denied();if(!proc[id])proc[id]=['chrome.exe','discord.exe','teams.exe','steam.exe','winword.exe','spotify.exe','notepad.exe','java.exe'].map((name,i)=>({name,base:'Autorisé',stage:[1,3,7].includes(i)?'Interdit':null,override:null,running:![1,3,7].includes(i)}));const list=proc[id].filter(p=>(!filters.q||p.name.includes(filters.q.toLowerCase()))&&(!filters.state||effective(p)===filters.state));return `<a class="back" href="#supervision?room=${m.room}">‹ Retour aux postes</a>`+heading(m.id,`${roomName(m.room)} · ${room(m.room).building}`,badge(m.online?'Connecté':'Hors ligne'))+`<section class="panel"><div class="panel-body roomhero"><span class="iconbox">${icon('room')}</span><div><strong>${esc(m.name)} · ${esc(m.user)}</strong><p class="subtle">IP : ${m.ip} &nbsp; | &nbsp; MAC : ${m.mac}</p></div><div class="notice" style="margin:0;margin-left:auto;max-width:400px">Priorité des règles : Formateur › Stage › Base.<br>Un processus interdit est arrêté et ne peut plus être exécuté.</div></div></section>${!training()?'<div class="notice">Consultation seule. Pour modifier les règles, choisissez le rôle Formateur.</div>':''}${!m.online?'<div class="notice warning">Ce poste est hors ligne. Les processus en cours ne peuvent pas être récupérés.</div>':''}<section class="panel"><div class="panel-title">Processus de la machine</div><div class="filters">${search('Rechercher un processus…')}${selectFilter('Règle actuelle','state',['Autorisé','Interdit'])}${btn('Actualiser','refresh','','','refresh')}</div>${m.online?table(['Processus','État','Origine de la règle','Exécution','Action','Règle personnelle'],list.map(p=>`<tr><td><span class="processlogo">${p.name[0].toUpperCase()}</span>${p.name}</td><td>${badge(effective(p))}</td><td>${p.override?'Formateur':p.stage?'Stage':'Base'}</td><td>${p.running?'En cours':'Arrêté'}</td><td>${training()?btn(effective(p)==='Autorisé'?'Interdire':'Autoriser','toggle-process',`${id}|${p.name}`,effective(p)==='Autorisé'?'small danger':'small'):'—'}</td><td>${training()&&p.override?btn('Supprimer','delete-rule',`${id}|${p.name}`,'small'):'—'}</td></tr>`)):'<div class="empty">Poste hors ligne</div>'}<div class="count"><span>${m.online?list.length:0} processus</span>${training()&&m.online?btn('Réinitialiser les règles','reset-rules',id,'small','refresh'):''}</div></section>${training()?'<details class="scenario"><summary>Scénario alternatif de démonstration</summary><label><input type="checkbox" data-scenario="processError" '+(scenario.processError?'checked':'')+'>Simuler une erreur d’enregistrement</label></details>':''}`}
const effective=p=>p.override||p.stage||p.base;
function alertsPage(){if(role==='Stagiaire')return learningHome();let list=alerts.filter(a=>(admin()||role==='Formateur'||a.author==='Lucas Martin')&&(!filters.status||a.status===filters.status));return heading(admin()?'Alertes et signalements':'Mes signalements',`${alerts.filter(a=>a.status==='En attente').length} signalements en attente de traitement`,['Formateur','Stagiaire'].includes(role)?btn('Signaler un problème','report','','primary','plus'):'')+`<section class="panel"><div class="filters">${selectFilter('État','status',['En attente','Validée','Refusée'])}${resetFilters()}</div>${table(['Matériel concerné','Signalement','Auteur','État','Actions'],list.map(a=>`<tr><td>${a.ids.map(id=>`<a href="#materials/${id}">${esc(id)}</a>`).join('<br>')}</td><td style="white-space:normal;min-width:250px;max-width:450px"><strong>${esc(a.type)}</strong><div class="subtle" style="margin-top:6px">${esc(a.description)}</div><small class="subtle">${a.date}</small></td><td>${esc(a.author)}</td><td>${badge(a.status)}</td><td>${admin()&&a.status==='En attente'?`<div class="actions">${btn('Valider','validate-alert',a.id,'small')}${btn('Refuser','reject-alert',a.id,'small danger')}</div>`:'—'}</td></tr>`))}</section>`}


function stagePeople(id,kind){return users.filter(u=>u.stageId===id&&u.role===kind).map(u=>`${esc(u.firstName)} ${esc(u.lastName)}`).join('<br>')||'Aucun';}
function updateUserStageField(userRole,selected){
 const target=$('#userStageField');
 if(!['Stagiaire','Formateur'].includes(userRole)){target.innerHTML='';return;}
 const available=stages.filter(s=>s.status!=='Clôturé');
 target.innerHTML=sf('Stage','stageId',[['','Choisir un stage…'],...available.map(s=>[s.id,`${s.name} · ${date(s.start)} – ${date(s.end)}`])],selected)+`<small>${available.length?'Un seul stage par utilisateur. Changer de stage remplace l’affectation précédente.':'Aucun stage disponible. Créez un stage avant cet utilisateur.'}</small>`;
}
function assignTrainees(id){
 if(role!=='Administrateur')return;
 const st=stage(id);if(!st||st.status==='Clôturé')return toast('Impossible d’affecter des stagiaires à un stage clôturé.',true);
 const candidates=users.filter(u=>u.role==='Stagiaire'&&u.active&&u.stageId!==id&&stage(u.stageId)?.status!=='Clôturé');
 modal(`Affecter des stagiaires — ${esc(st.name)}`,`<div class="notice">Un stagiaire n’appartient qu’à un seul stage. Les personnes sélectionnées seront retirées de leur stage précédent et affectées à celui-ci.</div><p class="subtle">Stagiaires déjà affectés : ${stagePeople(id,'Stagiaire')}</p>${candidates.map(u=>`<label class="option"><input type="checkbox" name="traineeIds" value="${u.id}"><span>${esc(u.firstName)} ${esc(u.lastName)}<small>${esc(stage(u.stageId)?.name||'Sans stage')} · ${esc(u.email)}</small></span></label>`).join('')||'<div class="empty">Aucun autre stagiaire actif disponible. Vous pouvez en créer dans Utilisateurs.</div>'}`,candidates.length?'Affecter':'',f=>{
  if(role!=='Administrateur'||st.status==='Clôturé')return error('Cette affectation n’est pas autorisée.');

 });

function usersPage(){
  if(role!=='Administrateur')return denied();
  const list=users.filter(u=>(!filters.q||`${u.firstName} ${u.lastName} ${u.email}`.toLowerCase().includes(filters.q.toLowerCase()))&&(!filters.userRole||u.role===filters.userRole)&&(!filters.userStatus||(u.active?'Actif':'Inactif')===filters.userStatus));
  return heading('Gestion des utilisateurs','Gérer les comptes, les rôles et leur état.',btn('Ajouter un utilisateur','user-form','','primary','plus'))+

}
function userForm(id){
  if(role!=='Administrateur')return;
  const existing=users.find(u=>u.id===id);
  if(id&&!existing)return toast('Utilisateur introuvable.',true);
  const u=existing||{role:'Stagiaire',active:true};
  modal(existing?'Modifier un utilisateur':'Ajouter un utilisateur',`${!existing?`<div class="actions" style="margin-bottom:20px">${btn('Importer des utilisateurs','import-users','','','plus')}</div>`:''}<div class="formgrid">${field('Prénom','firstName',u.firstName||'','text',true,'maxlength="60"')}${field('Nom','lastName',u.lastName||'','text',true,'maxlength="60"')}${field('Adresse e-mail','email',u.email||'','email')}${sf('Rôle','role',['Administrateur','Gestionnaire','Formateur','Stagiaire'],u.role)}${sf('État','active',[['true','Actif'],['false','Inactif']],String(u.active))}<div id="userStageField" class="field full"></div></div><p class="subtle">Compte de démonstration : aucun accès réel ni invitation ne sera envoyé.</p>`,existing?'Enregistrer':'Ajouter',f=>{
    if(role!=='Administrateur')return error('Action réservée à l’administrateur.');
    const data={firstName:String(f.get('firstName')||'').trim(),lastName:String(f.get('lastName')||'').trim(),email:String(f.get('email')||'').trim().toLowerCase(),role:f.get('role'),active:f.get('active')==='true'};
    if(!data.firstName||!data.lastName)return error('Le prénom et le nom sont obligatoires.');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email))return error('Saisissez une adresse e-mail valide.');
    if(!['Administrateur','Gestionnaire','Formateur','Stagiaire'].includes(data.role))return error('Choisissez un rôle valide.');
    if(users.some(other=>other.id!==id&&other.email.toLowerCase()===data.email))return error('Cette adresse e-mail est déjà utilisée.');
    const needsStage=['Stagiaire','Formateur'].includes(data.role);
    data.stageId=needsStage?String(f.get('stageId')||''):'';
    if(needsStage&&(!stage(data.stageId)||stage(data.stageId).status==='Clôturé'))return error('Choisissez un stage non clôturé pour ce stagiaire ou ce formateur.');
    if(existing)Object.assign(existing,data);else users.push({id:'U'+Date.now(),...data});
    close();render();toast(existing?'Utilisateur modifié.':'Utilisateur ajouté.');
  });
  updateUserStageField(u.role,u.stageId||'');
  $('#form [name=role]').addEventListener('change',e=>updateUserStageField(e.target.value,u.stageId||''));
}
function userStatus(id){
  if(role!=='Administrateur')return;
  const u=users.find(u=>u.id===id);if(!u)return;
  const next=!u.active;
  modal(next?'Activer cet utilisateur ?':'Désactiver cet utilisateur ?',`<p>${esc(u.firstName)} ${esc(u.lastName)} · ${esc(u.email)}</p><div class="notice">${next?'Le compte sera marqué actif.':'Le compte sera marqué inactif et conservé dans la liste des utilisateurs.'}</div>`,next?'Activer':'Désactiver',()=>{
    if(role!=='Administrateur')return error('Action réservée à l’administrateur.');
    u.active=next;close();render();toast(next?'Utilisateur activé.':'Utilisateur désactivé.');
  });
}

const denied=()=>'<div class="panel empty"><strong>Accès réservé</strong>Ce rôle ne permet pas cette action. Changez de rôle avec le sélecteur en haut à droite.</div>';const missing=()=>'<div class="panel empty"><strong>Élément introuvable</strong><a href="#home">Revenir à l’accueil</a></div>';
function render(){nav();let [path,query]=(location.hash.slice(1)||'home').split('?');let [section,id]=path.split('/');const fn={home,materials:()=>id?materialDetail(id):materialsPage(),rooms:()=>id?roomDetail(id):roomsPage(),stages:()=>id?stageDetail(id):stagesPage(),supervision:()=>id?processes(id):supervision(),alerts:alertsPage,users:usersPage};$('#main').innerHTML=(fn[section]||home)();}
function modal(title,body,submit,handler){if($('#modal').open)$('#modal').close();modalAction=handler;$('#modal').innerHTML=`<form id="form"><div class="modal-head"><h2>${title}</h2><button type="button" class="close" data-action="cancel" aria-label="Fermer">×</button></div><div class="modal-body"><div id="formerror" class="formerror" role="alert"></div>${body}</div><div class="modal-foot"><button type="button" class="btn" data-action="cancel">Annuler</button>${submit?`<button class="btn primary" type="submit">${submit}</button>`:''}</div></form>`;$('#modal').showModal();}
const close=()=>$('#modal').close();const error=msg=>{$('#formerror').textContent=msg;$('#formerror').scrollIntoView({block:'nearest'})};
function roomForm(){if(!admin())return;modal('Créer une salle',`<div class="formgrid">${field('Nom de la salle','name','','text',true,'maxlength="60"')}${field('Capacité','capacity','','number',true,'min="1" max="500"')}${sf('Type de salle','type',['Salle de cours','Salle informatique','Stockage'])}${sf('État','status',['Disponible','Non disponible'])}${sf('Bâtiment','building',['Bâtiment A','Bâtiment B'])}<label class="field full">Description<textarea name="description" placeholder="Informations complémentaires…"></textarea></label></div>`, 'Créer',f=>{const name=f.get('name').trim();if(!name)return error('Le nom de la salle est obligatoire.');if(rooms.some(r=>r.name.toLowerCase()===name.toLowerCase()))return error('Ce nom de salle existe déjà. Choisissez un nom unique.');const capacity=Number(f.get('capacity'));if(f.get('type')!=='Stockage'&&(!Number.isInteger(capacity)||capacity<1))return error('La capacité doit être un nombre entier positif.');let id='S'+Date.now();rooms.push({id,name,type:f.get('type'),capacity,building:f.get('building'),location:'',status:f.get('status'),last:'—'});close();location.hash='rooms/'+id;render();toast('Salle créée avec succès.');});}
function materialForm(id){if(id?!canManage():!admin())return;const m=mat(id)||{status:'Disponible',room:'STOCK',date:'2026-10-06'};modal(id?'Modifier un matériel':'Ajouter un matériel',`${!id?`<div class="actions" style="margin-bottom:20px">${btn('Importer du matériel','import-materials','','','plus')}</div>`:''}<div class="formgrid">${field('N° de série','id',m.id||'','text',true,id?'readonly':'')}${field('Nom','name',m.name||'')}${sf('Type','type',['UC','Écran','Projecteur'],m.type)}${sf('État','status',['Disponible','En maintenance'],m.status)}${field('Marque','brand',m.brand||'')}${field('Modèle','model',m.model||'')}${sf('Salle','room',rooms.map(r=>[r.id,r.name]),m.room)}${field('Localisation','location',m.location||'')}${field('Date d’achat','date',m.date,'date')}</div>`,id?'Enregistrer':'Ajouter',f=>{const data=Object.fromEntries(f);for(const k of ['id','name','brand','model','location']){data[k]=data[k].trim();if(!data[k])return error('Tous les champs obligatoires doivent être renseignés.');}if(!id&&mat(data.id))return error('Ce numéro de série existe déjà.');if(id)Object.assign(m,data);else materials.push({...data,online:false,user:'—',ip:'Non renseignée',mac:'Non renseignée'});close();render();toast(id?'Matériel modifié.':'Matériel ajouté.');});}
let transferSelected=new Set();
function transfer(id='',target=''){
 if(!admin())return;transferSelected=new Set(id?[id]:[]);
 modal('Affecter du matériel',`<label class="field">Salle de destination *<select id="transferRoom" name="room" required>${opts([['','Choisir une salle'],...rooms.map(r=>[r.id,r.name])],target)}</select></label><p class="subtle">Seuls les matériels disponibles hors de cette salle peuvent être affectés.</p><div class="filters" style="padding:0 0 18px"><label class="search">Recherche<input id="transferSearch" placeholder="Nom, numéro de série ou marque…"></label><label>Type de matériel<select id="transferType">${opts([['','Tous'],...[...new Set(materials.map(m=>m.type))]])}</select></label><label>Salle actuelle<select id="transferSource">${opts([['','Toutes'],...rooms.map(r=>[r.id,r.name])])}</select></label></div><p class="subtle" id="transferCount"></p><div id="transferList"></div>`, 'Enregistrer',f=>{
  if(!admin())return error('Action réservée au gestionnaire et à l’administrateur.');
  const dest=f.get('room'),ids=[...transferSelected];if(!room(dest)||!ids.length)return error('Sélectionnez une salle et au moins un matériel.');
  if(ids.some(i=>!mat(i)||mat(i).status!=='Disponible'||mat(i).room===dest))return error('Un matériel sélectionné n’est plus disponible.');
  ids.forEach(i=>{mat(i).room=dest;mat(i).location='À préciser'});close();render();toast(`${ids.length} matériel(s) affecté(s) à ${roomName(dest)}.`);
 });updateTransfer();
 $('#transferRoom').addEventListener('change',()=>{for(const id of transferSelected)if(mat(id)?.room===$('#transferRoom').value)transferSelected.delete(id);updateTransfer();});
 for(const selector of ['#transferSearch','#transferType','#transferSource'])$(selector).addEventListener('input',updateTransfer);
 $('#transferList').addEventListener('change',e=>{if(e.target.name==='materials'){if(e.target.checked)transferSelected.add(e.target.value);else transferSelected.delete(e.target.value);updateTransferCount();}});

function transferMatches(dest,q='',type='',source=''){return materials.filter(m=>m.room!==dest&&m.status==='Disponible'&&(!q||`${m.id} ${m.name} ${m.brand}`.toLowerCase().includes(q.toLowerCase()))&&(!type||m.type===type)&&(!source||m.room===source));}
function updateTransferCount(){$('#transferCount').textContent=`${transferSelected.size} matériel(s) sélectionné(s), y compris ceux masqués par les filtres.`;}
function updateTransfer(){
 const dest=$('#transferRoom').value,q=$('#transferSearch').value,type=$('#transferType').value,source=$('#transferSource').value;
 $('#transferList').innerHTML=!dest?'<div class="empty">Choisissez la salle de destination.</div>':transferMatches(dest,q,type,source).map(m=>`<label class="option"><input type="checkbox" name="materials" value="${esc(m.id)}" ${transferSelected.has(m.id)?'checked':''}><span>${esc(m.name)} · ${m.id}<small>${esc(roomName(m.room))} · ${esc(m.type)}</small></span></label>`).join('')||'<div class="empty">Aucun matériel ne correspond aux filtres.</div>';updateTransferCount();

function reinstall(id){if(!canManage())return;const r=room(id),list=pcs(id);if(r.status==='Réinstallation en cours')return toast('Une réinstallation est déjà en cours pour cette salle.',true);if(!list.length)return toast('Réinstallation impossible : cette salle ne contient aucun poste.',true);modal('Lancer la réinstallation ?',info([['Salle',esc(r.name)],['Postes concernés',list.length],['Postes connectés',list.filter(p=>p.online).length]])+`<div class="notice warning">${list.some(p=>p.online)?'Des utilisateurs sont connectés. Leurs sessions seront interrompues.':'Tous les postes sont hors ligne.'} Tous les postes de la salle sont concernés.</div><details class="scenario"><summary>Scénario alternatif de démonstration</summary><label><input type="checkbox" name="unreachable">Simuler un poste injoignable</label></details>`, 'Valider',f=>{if(r.status==='Réinstallation en cours')return error('Une réinstallation est déjà en cours.');r.status='Réinstallation en cours';r.failed=f.has('unreachable')?list[list.length-1].id:'';list.forEach(m=>{if(m.id!==r.failed){m.online=false;m.user='—'}});close();render();toast(`Réinstallation lancée sur ${r.name} (simulation).`);});}
function freeRooms(s){return rooms.filter(r=>r.type!=='Stockage'&&r.status==='Disponible'&&!stages.some(o=>o.id!==s.id&&o.status!=='Clôturé'&&o.room===r.id&&s.start<=o.end&&s.end>=o.start));}
function roomStages(rid){
 const pending=stages.filter(st=>st.status==='À affecter');
 const assigned=stages.filter(st=>st.room===rid&&st.status!=='Clôturé');
 return `<section class="panel"><div class="panel-title">Affectation des stages</div>${assigned.map(st=>`<div class="listitem"><span class="name">${esc(st.name)}<small>${date(st.start)} – ${date(st.end)}</small></span><span class="right">${badge(st.status)}</span></div>`).join('')}${pending.length?table(['Stage à affecter','Dates','Formation','Action'],pending.map(st=>`<tr><td class="name">${esc(st.name)}</td><td>${date(st.start)} – ${date(st.end)}</td><td>${esc(st.type)}</td><td>${btn('Affecter le stage à une salle','assign-stage',st.id+'|'+rid,'small','room')}</td></tr>`)):'<div class="empty">Aucun stage à affecter.</div>'}</section>`;
}
function assignStage(value){
 if(!admin())return;
 const [id,preferred]=value.split('|'),st=stage(id);
 if(!st||st.status!=='À affecter')return toast('Seuls les stages au statut « À affecter » peuvent être affectés.',true);
 modal(`Affecter ${esc(st.name)} à une salle`,info([['Stage',esc(st.name)],['Dates',`${date(st.start)} – ${date(st.end)}`],['Formation',esc(st.type)]])+`<div class="divider"></div><p class="subtle">Seules les salles disponibles et libres sur toute la période sont proposées.</p><div id="availableRooms"></div>`, 'Valider',f=>{
  if(!admin()||st.status!=='À affecter')return error('Ce stage ne peut plus être affecté.');

  if(!freeRooms(st).some(r=>r.id===rid)){error('Cette salle n’est plus disponible. Choisissez une autre salle.');populateAvailable(st);return;}
  st.room=rid;st.status='Affecté';close();render();toast(`${st.name} affecté à ${roomName(rid)}.`);
 });populateAvailable(st,preferred);
}
function populateAvailable(st,preferred=''){
 const list=freeRooms(st);
 $('#availableRooms').innerHTML=list.map(r=>`<label class="option"><input type="radio" name="room" value="${r.id}" ${r.id===preferred?'checked':''} required><span>${esc(r.name)}<small>${esc(r.building)} · ${pcs(r.id).length} postes · ${r.capacity} places</small></span></label>`).join('')||'<div class="notice">Aucune salle disponible sur la période de ce stage.</div>';
 $('#form button[type=submit]').disabled=!list.some(r=>r.id===preferred);
 $('#availableRooms').onchange=()=>$('#form button[type=submit]').disabled=false;
}

function closeStage(id){if(!canManage()||!canViewStages())return;const s=stage(id);if(s.status!=='En cours'||s.source!=='SAGAIE')return toast('Seul un stage SAGAIE en cours peut être clôturé.',true);modal('Clôturer ce stage ?',info([['Stage',esc(s.name)],['Dates',`${date(s.start)} – ${date(s.end)}`],['Salle',esc(roomName(s.room))]])+'<div class="notice warning">Le stage ne sera plus modifiable. La salle et les postes seront libérés, puis SAGAIE sera notifié.</div><details class="scenario"><summary>Scénario alternatif de démonstration</summary><label><input type="checkbox" name="sagaieError">Simuler SAGAIE injoignable</label></details>','Valider',f=>{if(s.status!=='En cours')return error('Ce stage n’est plus en cours.');s.status='Clôturé';s.oldRoom=s.room;s.room='';s.closedAt=new Date().toLocaleString('fr-FR');s.closedBy=role;s.notified=!f.has('sagaieError');close();render();toast(s.notified?'Stage clôturé. Ressources libérées et SAGAIE notifié (simulation).':'Stage clôturé. Notification SAGAIE en échec ; vous pouvez réessayer.',!s.notified);});}

function alreadyImported(kind,r){return kind==='stages'?!!stage(r.id):kind==='materials'?!!mat(r.id):users.some(u=>u.id===r.id||u.email.toLowerCase()===r.email.toLowerCase());}
function importRecords(kind){
 if(kind==='materials'?!admin():role!=='Administrateur')return;
 const catalogue=externalRecords[kind];if(!catalogue)return;
 const title={stages:'Importer des stages',users:'Importer des utilisateurs',materials:'Importer du matériel'}[kind];
 const available=catalogue.filter(r=>!alreadyImported(kind,r));
 const options=catalogue.map(r=>{const imported=alreadyImported(kind,r);const name=kind==='users'?`${r.firstName} ${r.lastName}`:r.name;const description=kind==='stages'?`${date(r.start)} – ${date(r.end)} · ${r.type} · Chef : ${r.chief}`:kind==='users'?`${r.role} · ${r.email}`:`${r.id} · ${r.type} · ${r.brand} ${r.model}`;return `<label class="option"><input type="checkbox" name="importIds" value="${r.id}" ${imported?'disabled':''}><span>${esc(name)}<small>${esc(description)}</small></span>${imported?'<span class="badge">Déjà importé</span>':''}</label>`}).join('');
 const assignment=kind==='users'?sf('Stage des utilisateurs sélectionnés','stageId',[['','Choisir un stage…'],...stages.filter(st=>st.status!=='Clôturé').map(st=>[st.id,st.name])]):kind==='materials'?sf('Salle des matériels importés','room',rooms.map(r=>[r.id,r.name]),'STOCK'):'';
 modal(title,`<div class="notice">Liste chargée depuis une source externe — données de démonstration. Sélectionnez un ou plusieurs éléments à importer.</div>${options}${available.length?assignment:'<p class="subtle">Tous les éléments disponibles ont déjà été importés.</p>'}`,available.length?'Importer la sélection':'',f=>{
  if(kind==='materials'?!admin():role!=='Administrateur')return error('Import non autorisé.');
  const ids=[...new Set(f.getAll('importIds'))];if(!ids.length)return error('Sélectionnez au moins un élément à importer.');
  const selected=ids.map(id=>catalogue.find(r=>r.id===id));if(selected.some(r=>!r||alreadyImported(kind,r)))return error('Un élément est invalide ou a déjà été importé.');
  if(kind==='users'&&(!stage(f.get('stageId'))||stage(f.get('stageId')).status==='Clôturé'))return error('Choisissez un stage non clôturé.');
  if(kind==='materials'&&!room(f.get('room')))return error('Choisissez une salle.');
  for(const r of selected){
   if(kind==='stages')stages.push({...r,source:'SAGAIE',status:'À affecter',room:'',students:''});
   else if(kind==='users')users.push({...r,active:true,stageId:f.get('stageId')});
   else materials.push({...r,status:'Disponible',room:f.get('room'),location:'À préciser',online:false,user:'—',ip:'Non renseignée',mac:'Non renseignée'});
  }
  close();location.hash=kind;render();toast(`${selected.length} élément(s) importé(s) avec succès.`);
 });
}

function stageForm(){importRecords('stages');}

function report(id){if(!['Formateur','Stagiaire'].includes(role))return;const eligible=materials.filter(canReport);modal('Signaler un problème',`<label class="field">Type de problème *<select name="type" required>${opts(['Problème de connexion','Panne matérielle','Problème logiciel','Autre'])}</select></label><p class="subtle">Matériel(s) concerné(s) *</p>${eligible.map(m=>`<label class="option"><input type="checkbox" name="ids" value="${m.id}" ${m.id===id?'checked':''}><span>${esc(m.name)} · ${m.id}<small>${roomName(m.room)}</small></span></label>`).join('')}<label class="field">Description du problème<textarea name="description" maxlength="150" placeholder="Décrivez le problème rencontré…"></textarea><small>150 caractères maximum · <span id="charCount">0</span>/150</small></label>`,'Envoyer le signalement',f=>{const ids=f.getAll('ids'),description=String(f.get('description')||'');if(!ids.length)return error('Sélectionnez au moins un matériel.');if(description.length>150)return error('La description ne doit pas dépasser 150 caractères.');if(ids.some(i=>!canReport(mat(i))))return error('Un matériel n’est pas accessible pour ce rôle.');alerts.unshift({id:Date.now(),ids,type:f.get('type'),description,status:'En attente',author:role==='Stagiaire'?'Lucas Martin':'Formateur',date:new Date().toLocaleString('fr-FR')});close();render();toast('Signalement créé. Les administrateurs et gestionnaires ont été notifiés (simulation).');});$('#form textarea').oninput=e=>$('#charCount').textContent=e.target.value.length;}
function processAction(id,mode){const [mid,name]=id.split('|');const m=mat(mid);if(!training()||!roomAccess(m.room)||!m.online)return;const p=proc[mid]?.find(p=>p.name===name);const apply=()=>{if(scenario.processError){close();toast('La modification n’a pas pu être enregistrée. La règle précédente est conservée.',true);return;}if(mode==='toggle'){p.override=effective(p)==='Autorisé'?'Interdit':'Autorisé';if(effective(p)==='Interdit')p.running=false;}else if(mode==='delete'){p.override=null;if(effective(p)==='Interdit')p.running=false;}else proc[mid].forEach(p=>{p.override=null;if(effective(p)==='Interdit')p.running=false});close();render();toast('Règle enregistrée. Les processus interdits sont arrêtés.');};if(mode==='toggle')apply();else modal(mode==='delete'?'Supprimer la règle personnelle ?':'Réinitialiser les règles ?',`<p>Les règles du stage et de base s’appliqueront à nouveau ${mode==='delete'?`à ${esc(name)}`:'aux processus de cette machine'}.</p>`,'Valider',apply);}
document.addEventListener('submit',e=>{if(e.target.id==='form'){e.preventDefault();modalAction?.(new FormData(e.target));}});
document.addEventListener('input',e=>{if(e.target.dataset.filter){const key=e.target.dataset.filter,pos=e.target.selectionStart;if(key==='room'&&location.hash.split('?')[0]==='#supervision')filters={room:e.target.value};else filters[key]=e.target.value;page=1;render();let el=document.querySelector(`[data-filter="${key}"]`);el?.focus();if(el?.setSelectionRange&&pos!==null)el.setSelectionRange(pos,pos);}});
document.addEventListener('change',e=>{if(e.target.id==='role'){role=e.target.value;filters={};page=1;close();location.hash='home';render();}if(e.target.name==='type'&&$('#form [name=capacity]')){const cap=$('#form [name=capacity]'),storage=e.target.value==='Stockage';cap.required=!storage;cap.min=storage?'0':'1';if(storage)cap.value='';}if(e.target.id==='auto'){filters.auto=e.target.checked;toast(e.target.checked?'Actualisation simulée toutes les 15 secondes.':'Actualisation automatique désactivée.');}if(e.target.dataset.scenario)scenario[e.target.dataset.scenario]=e.target.checked;});
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,id=el.dataset.id;const actions={'import-users':()=>importRecords('users'),'import-materials':()=>importRecords('materials'),'assign-trainees':()=>assignTrainees(id),'user-form':()=>userForm(id),'user-status':()=>userStatus(id),cancel:close,filters:()=>{filters={};page=1;render()},prev:()=>{page=Math.max(1,page-1);render()},next:()=>{page=Math.min(Number(id),page+1);render()},'room-form':roomForm,'material-form':()=>materialForm(id),transfer:()=>transfer(id),'transfer-room':()=>transfer('',id),reinstall:()=>reinstall(id),'stage-form':stageForm,'assign-stage':()=>assignStage(id),'close-stage':()=>closeStage(id),retry:()=>{if(canManage()&&canViewStages()){stage(id).notified=true;render();toast('Notification SAGAIE transmise (simulation).')}},report:()=>report(id),'toggle-process':()=>processAction(id,'toggle'),'delete-rule':()=>processAction(id,'delete'),'reset-rules':()=>processAction(id,'reset'),refresh:()=>{refreshTime=new Date().toLocaleTimeString('fr-FR');render();toast('Informations actualisées (données de démonstration).')},'validate-alert':()=>alertStatus(id,'Validée'),'reject-alert':()=>alertStatus(id,'Refusée'),reset:()=>modal('Recommencer la démonstration ?','<p>Les modifications de cette session seront effacées. Les données exemples seront restaurées.</p>','Recommencer',()=>{seed();filters={};page=1;close();location.hash='home';render();toast('Démonstration réinitialisée.');})};actions[a]?.();});
function alertStatus(id,status){if(!admin())return;let a=alerts.find(x=>String(x.id)===id);modal(status==='Validée'?'Valider le signalement ?':'Refuser le signalement ?',`<p>${esc(a.description)}</p><div class="subtle">${esc(a.ids.join(', '))}</div>`,'Confirmer',()=>{a.status=status;close();render();toast(`Signalement ${status.toLowerCase()}.`);});}
window.addEventListener('hashchange',()=>{filters={};const q=location.hash.split('?')[1];if(q)filters.room=new URLSearchParams(q).get('room');page=1;render();window.scrollTo(0,0)});setInterval(()=>{if(filters.auto&&location.hash.startsWith('#supervision')&&!$('#modal').open){refreshTime=new Date().toLocaleTimeString('fr-FR');render()}},15000);render();
if(document.modelContext?.registerTool){try{document.modelContext.registerTool({name:'search_materials',title:'Rechercher les matériels SESAM',description:'Recherche les matériels et affiche les résultats dans la maquette.',inputSchema:{type:'object',properties:{query:{type:'string'}},required:['query'],additionalProperties:false},annotations:{readOnlyHint:false},execute:async input=>{if(!admin())throw new Error('Rôle non autorisé');if(typeof input?.query!=='string')throw new Error('Recherche invalide');location.hash='materials';await new Promise(resolve=>setTimeout(resolve,0));filters={q:input.query};render();return {materials:materials.filter(m=>`${m.id} ${m.name} ${m.brand}`.toLowerCase().includes(input.query.toLowerCase())).map(m=>({id:m.id,name:m.name,room:roomName(m.room)}))};}})}catch{}}
