<div id="bravo-parc" lang="fr">
<style>
#bravo-parc{--bp-bg:light-dark(#f5f6f8,#171c23);--bp-panel:light-dark(#fff,#222933);--bp-text:light-dark(#192638,#e7edf4);--bp-muted:light-dark(#637084,#aab7c8);--bp-line:light-dark(#dfe5ec,#3c4756);--bp-main:light-dark(#233f60,#b2cff3);--bp-on:light-dark(#fff,#152235);--bp-soft:light-dark(#e9eff6,#303e52);--bp-warn:light-dark(#8b5412,#ffd28c);--bp-warnbg:light-dark(#fff2dc,#453723);--bp-red:light-dark(#a73131,#ffb1a9);--bp-redbg:light-dark(#fff0ed,#482e30);--bp-green:light-dark(#286649,#a5dec0);--bp-greenbg:light-dark(#eaf5ee,#243e34);font:14px/1.5 Arial,Helvetica,sans-serif;color:var(--bp-text);background:var(--bp-bg);border:1px solid var(--bp-line);border-radius:14px;overflow:hidden;position:relative;color-scheme:light dark}

#bravo-parc h1,#bravo-parc h2,#bravo-parc h3,#bravo-parc p{margin:0}
#bravo-parc h1{font-size:25px;letter-spacing:-.6px;line-height:1.25;font-weight:700}
#bravo-parc h2{font-size:18px;line-height:1.4;font-weight:700}
#bravo-parc h3{font-size:15px;line-height:1.4;font-weight:700}
#bravo-parc .bp-top{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:20px 110px 20px 24px;background:var(--bp-panel);border-bottom:1px solid var(--bp-line)}
#bravo-parc .bp-brand{display:flex;align-items:center;gap:12px}

#bravo-parc .bp-button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:7px 11px;border:1px solid var(--bp-line);border-radius:6px;background:var(--bp-panel);color:var(--bp-text);white-space:normal}

#bravo-parc input,#bravo-parc select,#bravo-parc textarea{width:100%;min-width:0;color:var(--bp-text);background:var(--bp-panel);border:1px solid var(--bp-line);border-radius:6px;padding:8px 10px;min-height:38px}
#bravo-parc textarea{resize:vertical}
#bravo-parc .bp-search{position:relative}
#bravo-parc .bp-search input{padding-left:34px}

#bravo-parc svg{width:16px;height:16px;flex:none}

#bravo-parc .bp-room{display:flex;flex-direction:column;gap:15px;background:var(--bp-panel);border:1px solid var(--bp-line);border-radius:9px;text-align:left;padding:17px;color:var(--bp-text)}
#bravo-parc .bp-room:hover{border-color:var(--bp-main);background:var(--bp-soft)}
#bravo-parc .bp-room-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
#bravo-parc .bp-room-icon{background:var(--bp-bg);border-radius:6px;padding:8px;display:flex;color:var(--bp-muted)}
#bravo-parc .bp-room-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--bp-line);padding-top:12px;font-size:12px;color:var(--bp-muted)}
#bravo-parc .bp-badge{display:inline-flex;align-items:center;gap:5px;border-radius:4px;padding:3px 7px;font-size:11px;font-weight:500;white-space:normal;background:var(--bp-soft);color:var(--bp-main)}
#bravo-parc .bp-badge.bp-warning{background:var(--bp-warnbg);color:var(--bp-warn)}
#bravo-parc .bp-badge.bp-bad{background:var(--bp-redbg);color:var(--bp-red)}
#bravo-parc .bp-badge.bp-good{background:var(--bp-greenbg);color:var(--bp-green)}
#bravo-parc .bp-panel{background:var(--bp-panel);border:1px solid var(--bp-line);border-radius:9px;padding:19px;margin-top:18px}
#bravo-parc .bp-alert{display:flex;gap:12px;align-items:flex-start;background:var(--bp-warnbg);color:var(--bp-warn);border-radius:7px;padding:13px 15px;margin:0 0 19px;font-size:13px}
#bravo-parc .bp-alert svg{margin-top:2px}
#bravo-parc .bp-alert .bp-button{margin-left:auto;flex:none;background:var(--bp-panel);color:var(--bp-text)}
#bravo-parc .bp-link{border:0;background:none;color:var(--bp-main);text-decoration:underline;text-underline-offset:3px;padding:3px 0;text-align:left}
#bravo-parc .bp-tablewrap{overflow-x:auto;margin-top:14px;border:1px solid var(--bp-line);border-radius:8px;background:var(--bp-panel)}
#bravo-parc table{width:100%;border-collapse:collapse;font-size:12px;line-height:1.5}
#bravo-parc th{padding:11px 12px;background:var(--bp-bg);color:var(--bp-muted);text-align:left;font-weight:500;white-space:nowrap;border-bottom:1px solid var(--bp-line)}
#bravo-parc td{padding:13px 12px;border-bottom:1px solid var(--bp-line);vertical-align:middle}
#bravo-parc tr:last-child td{border-bottom:0}
#bravo-parc tbody tr:hover{background:var(--bp-bg)}
#bravo-parc td strong{font-weight:500}
#bravo-parc .bp-mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;overflow-wrap:anywhere}
#bravo-parc .bp-muted{color:var(--bp-muted)}
#bravo-parc .bp-summary{display:flex;gap:24px;flex-wrap:wrap;font-size:13px;margin-top:18px}
#bravo-parc .bp-summary strong{font-size:21px;margin-right:6px;font-weight:500}
#bravo-parc .bp-tabs{display:flex;gap:18px;margin-top:22px;border-bottom:1px solid var(--bp-line)}
#bravo-parc .bp-tab{padding:9px 0;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--bp-muted);font-weight:500}
#bravo-parc .bp-tab[aria-selected="true"]{border-color:var(--bp-main);color:var(--bp-main)}
#bravo-parc .bp-back{display:inline-flex;align-items:center;gap:5px;color:var(--bp-muted);border:0;background:transparent;padding:0;margin-bottom:15px}
#bravo-parc .bp-empty{padding:26px;text-align:center;color:var(--bp-muted)}
#bravo-parc .bp-notice{font-size:12px;color:var(--bp-muted);margin-top:18px}
#bravo-parc .bp-process{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:13px 0;border-bottom:1px solid var(--bp-line);align-items:center}
#bravo-parc .bp-process:last-child{border:0}
#bravo-parc .bp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
#bravo-parc .bp-detail{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;font-size:13px;margin:20px 0}
#bravo-parc .bp-detail dt{color:var(--bp-muted)}
#bravo-parc .bp-detail dd{margin:0;overflow-wrap:anywhere}
#bravo-parc .bp-dialog{margin:0;background:var(--bp-panel);border:1px solid var(--bp-line);border-radius:10px;padding:24px;box-shadow:0 8px 25px #00000014}
#bravo-parc .bp-dialog-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:18px}
#bravo-parc .bp-dialog .bp-actions{justify-content:flex-end;margin-top:20px}
#bravo-parc .bp-dialog .bp-field{margin:14px 0}
#bravo-parc .bp-dialog .bp-close{border:0;background:var(--bp-bg);color:var(--bp-text);border-radius:6px;min-height:34px;padding:5px 8px}
#bravo-parc .bp-bars{display:grid;gap:18px;margin-top:22px}
#bravo-parc .bp-bar-label{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:7px}
#bravo-parc .bp-track{height:9px;background:var(--bp-bg);border-radius:2px;overflow:hidden}
#bravo-parc .bp-track span{display:block;height:100%;background:var(--bp-main)}
#bravo-parc .bp-flash{background:var(--bp-greenbg);color:var(--bp-green);padding:11px 15px;border-radius:6px;margin-bottom:16px;font-size:13px}
#bravo-parc .bp-foot{border-top:1px solid var(--bp-line);padding:10px 22px;font-size:11px;color:var(--bp-muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--bp-panel)}
@media(max-width:780px){#bravo-parc .bp-shell{grid-template-columns:155px minmax(0,1fr)}#bravo-parc .bp-main{padding:20px}#bravo-parc .bp-sidebar{padding:15px 8px}#bravo-parc .bp-nav{font-size:12px;padding:10px 8px}#bravo-parc .bp-rooms{gap:10px}#bravo-parc .bp-room{padding:13px}#bravo-parc .bp-alert{flex-wrap:wrap}#bravo-parc .bp-alert .bp-button{margin-left:0}}
@media(max-width:580px){#bravo-parc .bp-top{padding:18px 18px;min-height:80px}#bravo-parc .bp-demo{padding-right:70px}#bravo-parc .bp-shell{grid-template-columns:minmax(0,1fr)}#bravo-parc .bp-sidebar{border-right:0;border-bottom:1px solid var(--bp-line);display:block;padding:8px 12px}#bravo-parc .bp-nav-label{display:none}#bravo-parc .bp-navigation{display:flex;flex-wrap:wrap;gap:3px}#bravo-parc .bp-nav{width:auto;min-height:40px}#bravo-parc .bp-nav svg{display:none}#bravo-parc .bp-role{margin-top:8px;padding-top:10px;display:flex;align-items:center;gap:12px}#bravo-parc .bp-role select{flex:1}#bravo-parc .bp-role small{display:none}#bravo-parc .bp-main{padding:18px;min-height:0}#bravo-parc h1{font-size:23px}#bravo-parc .bp-rooms,#bravo-parc .bp-grid{grid-template-columns:minmax(0,1fr)}#bravo-parc .bp-dialog{padding:16px}#bravo-parc .bp-detail{grid-template-columns:100px minmax(0,1fr)}#bravo-parc .bp-process{grid-template-columns:1fr}#bravo-parc input,#bravo-parc select,#bravo-parc textarea{font-size:16px}}
@media(pointer:coarse){#bravo-parc button{min-height:44px}}
</style>
<header class="bp-top"><div class="bp-brand"><span class="bp-mark"><i data-lucide="layers" aria-hidden="true"></i></span><div><strong>PARC / BRAVO</strong><div class="bp-small">DRHAT · PFORM</div></div></div><span class="bp-demo"><i data-lucide="pencil-ruler" aria-hidden="true"></i>Maquette · données fictives</span></header>
<div class="bp-shell"><aside class="bp-sidebar"><div class="bp-nav-label">Espace de travail</div><nav class="bp-navigation" aria-label="Navigation principale"></nav><div class="bp-role"><label for="bp-role">Vue du rôle</label><select id="bp-role"><option>Administrateur</option><option>Gestionnaire</option><option>Formateur</option><option>Formateur + gestionnaire</option></select><small>Aperçu des parcours</small></div></aside><main class="bp-main" id="bp-content"></main></div>
<footer class="bp-foot"><span>Groupe Bravo · Proposition d’interface</span><span>01 octobre 2026 · Actions simulées</span></footer>
<script>
(()=>{
const root=document.getElementById('bravo-parc'), main=root.querySelector('#bp-content');
const rooms=[{id:'a101',name:'Salle A101',building:'Bâtiment A',training:'Formation Java',use:'Formation',occupied:true},{id:'a102',name:'Salle A102',building:'Bâtiment A',training:'Formation Réseaux',use:'Formation',occupied:false},{id:'b201',name:'Salle B201',building:'Bâtiment B',training:'Formation React',use:'Formation',occupied:true},{id:'stock',name:'Salle de stockage',building:'Bâtiment A',training:'Stockage',use:'Stockage',occupied:false}];
const assets=[
{id:'PC-001',name:'OptiPlex 7010',brand:'Dell',type:'Poste',room:'a101',state:'Opérationnel',sn:'DL-A101-001',mac:'02:00:00:00:01:01',due:'2027-06-01'},
{id:'PC-002',name:'OptiPlex 7010',brand:'Dell',type:'Poste',room:'a101',state:'À vérifier',sn:'DL-A101-002',mac:'02:00:00:00:01:02',due:'2029-09-01'},
{id:'EC-001',name:'P2422H',brand:'Dell',type:'Écran',room:'a101',state:'Opérationnel',sn:'DL-EC-001',mac:'Sans adresse MAC',due:'2029-01-01'},
{id:'VP-001',name:'EB-982W',brand:'Epson',type:'Vidéoprojecteur',room:'a101',state:'Opérationnel',sn:'EP-VP-001',mac:'02:00:00:00:01:04',due:'2030-01-01'},
{id:'PC-003',name:'ProDesk 400',brand:'HP',type:'Poste',room:'a102',state:'Opérationnel',sn:'HP-A102-003',mac:'02:00:00:00:02:01',due:'2029-06-01'},
{id:'PC-004',name:'ProDesk 400',brand:'HP',type:'Poste',room:'a102',state:'Opérationnel',sn:'HP-A102-004',mac:'02:00:00:00:02:02',due:'2029-06-01'},
{id:'EC-002',name:'E24 G5',brand:'HP',type:'Écran',room:'a102',state:'Opérationnel',sn:'HP-EC-002',mac:'Sans adresse MAC',due:'2029-06-01'},
{id:'PC-005',name:'ThinkCentre M70',brand:'Lenovo',type:'Poste',room:'b201',state:'Opérationnel',sn:'LN-B201-005',mac:'02:00:00:00:03:01',due:'2029-01-01'},
{id:'PC-006',name:'ThinkCentre M70',brand:'Lenovo',type:'Poste',room:'b201',state:'Opérationnel',sn:'LN-B201-006',mac:'02:00:00:00:03:02',due:'2027-09-01'},
{id:'EC-003',name:'ThinkVision T24',brand:'Lenovo',type:'Écran',room:'b201',state:'Opérationnel',sn:'LN-EC-003',mac:'Sans adresse MAC',due:'2029-06-01'},
{id:'PC-007',name:'ProDesk 400',brand:'HP',type:'Poste',room:'stock',state:'Opérationnel',sn:'HP-ST-007',mac:'02:00:00:00:04:01',due:'2029-06-01'},
{id:'EC-004',name:'P2422H',brand:'Dell',type:'Écran',room:'stock',state:'Hors service',sn:'DL-ST-004',mac:'Sans adresse MAC',due:'2028-06-01'}];
const feedback=[{id:1,asset:'PC-002',room:'a101',text:'Le poste redémarre pendant les exercices.',status:'À traiter',author:'Formateur',date:'01/10/2026'}];
let state={page:'rooms',role:'Administrateur',room:'a101',building:'Tous',training:'Toutes',query:'',type:'Tous',brand:'Toutes',assetRoom:'Toutes',tab:'equipment',allowed:true,dialog:null,flash:''};
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const canManage=()=>state.role!=='Formateur';
const isAdmin=()=>state.role==='Administrateur';
const canSupervise=()=>isAdmin()||state.role.includes('Formateur');
const roomOf=id=>rooms.find(r=>r.id===id);
const roomAssets=id=>assets.filter(a=>a.room===id);
const due=a=>a.due<='2027-10-01';
const date=v=>new Date(v+'T12:00:00').toLocaleDateString('fr-FR');
const badge=(label,cls='')=>`<span class="bp-badge ${cls}">${label}</span>`;
const assetStatus=a=>badge(esc(a.state),a.state==='Opérationnel'?'bp-good':a.state==='Hors service'?'bp-bad':'bp-warning');
const openCount=()=>feedback.filter(f=>f.status==='À traiter').length;
const visibleRooms=()=>state.role==='Formateur'?rooms.filter(r=>r.id==='a101'):rooms;
const button=(text,act,cls='',data='')=>`<button type="button" class="bp-button ${cls}" data-action="${act}" ${data}>${text}</button>`;
const field=(label,id,values,selected)=>`<div class="bp-field"><label for="${id}">${label}</label><select id="${id}">${values.map(v=>`<option ${v===selected?'selected':''}>${esc(v)}</option>`).join('')}</select></div>`;
function nav(){
const entries=[['rooms','building-2','Salles'],...(canManage()?[['inventory','monitor','Inventaire']]:[]),['alerts','bell','Alertes'],...(canSupervise()?[['supervision','activity','Supervision']]:[]),...(isAdmin()?[['administration','hard-drive','Administration']]:[]),['stats','chart-no-axes-combined','Statistiques'],...(isAdmin()?[['roles','users','Rôles et droits']]:[])];
root.querySelector('nav').innerHTML=entries.map(([id,i,label])=>`<button class="bp-nav" type="button" data-page="${id}" ${state.page===id||(state.page==='room'&&id==='rooms')?'aria-current="page"':''}>${icon(i)}${label}${id==='alerts'?`<span class="bp-count">${feedback.filter(f=>f.status==='À traiter'&&(state.role!=='Formateur'||f.room==='a101')).length+assets.filter(a=>due(a)&&(state.role!=='Formateur'||a.room==='a101')).length}</span>`:''}</button>`).join('');
}
function header(title,sub,actions=''){return `<div class="bp-head"><div><div class="bp-eyebrow">${esc(state.role)} / ${state.page==='room'?'Salles':'Parc informatique'}</div><h1>${title}</h1><p class="bp-sub">${sub}</p></div><div class="bp-actions">${actions}</div></div>`;}
function assetTable(list,showRoom=true){return `<div class="bp-tablewrap"><table><thead><tr><th>Matériel / série</th>${showRoom?'<th>Salle</th>':''}<th>État</th><th>Remplacement</th><th><span class="bp-muted">Fiche</span></th></tr></thead><tbody>${list.length?list.map(a=>`<tr><td><strong>${esc(a.id)} · ${esc(a.brand)}</strong><div class="bp-mono bp-muted">${esc(a.sn)}</div></td>${showRoom?`<td>${esc(roomOf(a.room).name)}</td>`:''}<td>${assetStatus(a)}</td><td>${date(a.due)}${due(a)?'<div>'+badge('Moins d’un an','bp-warning')+'</div>':''}</td><td><button class="bp-link" data-asset="${a.id}" aria-label="Voir la fiche de ${a.id}">Voir</button></td></tr>`).join(''):'<tr><td colspan="5" class="bp-empty">Aucun matériel ne correspond aux filtres.</td></tr>'}</tbody></table></div>`;}
function roomsView(){const pending=feedback.filter(f=>f.status==='À traiter'&&(state.role!=='Formateur'||f.room==='a101'));return header('Salles et matériel','Un accès direct aux équipements de chaque salle.',canManage()?button(icon('upload')+'Importer une salle','import'):'')+(pending.length?`<div class="bp-alert">${icon('message-square-warning')}<div><strong>${pending.length} retour(s) utilisateur à traiter</strong><div>${esc(roomOf(pending[0].room).name)} · ${esc(pending[0].asset)} · ${esc(pending[0].text)}</div></div>${button('Voir les retours','all-feedback')}</div>`:'')+`<div class="bp-filters">${field('Bâtiment','bp-building',['Tous','Bâtiment A','Bâtiment B'],state.building)}${field('Formation','bp-training',['Toutes','Formation Java','Formation Réseaux','Formation React','Stockage'],state.training)}</div><div class="bp-section-label"><h2>Vos salles</h2><span class="bp-small" id="bp-room-total"></span></div><div class="bp-rooms" id="bp-rooms-grid"></div><p class="bp-notice">Le matériel en réserve reste affecté à la salle de stockage.</p>`;}
function drawRooms(){const list=visibleRooms().filter(r=>(state.building==='Tous'||r.building===state.building)&&(state.training==='Toutes'||r.training===state.training));const grid=root.querySelector('#bp-rooms-grid');if(!grid)return;root.querySelector('#bp-room-total').textContent=`${list.length} salle${list.length>1?'s':''}`;grid.innerHTML=list.map(r=>{const aa=roomAssets(r.id),count=feedback.filter(f=>f.room===r.id&&f.status==='À traiter').length;return `<button type="button" class="bp-room" data-room="${r.id}"><div class="bp-room-head"><span class="bp-room-icon">${icon(r.use==='Stockage'?'archive':'door-open')}</span>${count?badge(count+' retour','bp-warning'):badge(r.use==='Stockage'?'Réserve':r.occupied?'Occupée':'Disponible',r.occupied?'':'bp-good')}</div><div><h3>${esc(r.name)}</h3><div class="bp-small">${esc(r.building)} · ${esc(r.training)}</div></div><div class="bp-room-bottom"><span>${aa.length} matériels${aa.filter(due).length?' · '+aa.filter(due).length+' à renouveler':''}</span>${icon('arrow-up-right')}</div></button>`;}).join('')||'<p class="bp-empty">Aucune salle ne correspond aux filtres.</p>';icons();}
function roomView(){const r=roomOf(state.room),aa=roomAssets(r.id),ff=feedback.filter(f=>f.room===r.id);return `<button class="bp-back" data-page="rooms">${icon('arrow-left')}Toutes les salles</button>`+header(esc(r.name),esc(r.building)+' · '+esc(r.training),canManage()?button('Importer','import')+button('Exporter','export')+button('Copier','copy'):'')+`<div class="bp-summary"><span><strong>${aa.length}</strong>matériels</span><span><strong>${aa.filter(due).length}</strong>à renouveler sous un an</span><span><strong>${ff.filter(f=>f.status==='À traiter').length}</strong>retour à traiter</span></div><div class="bp-tabs" role="tablist" aria-label="Contenu de la salle"><button class="bp-tab" role="tab" aria-selected="${state.tab==='equipment'}" data-tab="equipment">Matériel</button><button class="bp-tab" role="tab" aria-selected="${state.tab==='feedback'}" data-tab="feedback">Retours utilisateurs (${ff.length})</button></div>${state.tab==='equipment'?assetTable(aa,false):feedbackList(ff)}<div class="bp-actions" style="margin-top:18px">${button(icon('message-square-plus')+'Signaler un problème','report')}${canSupervise()&&r.use!=='Stockage'?button(icon('activity')+'Superviser les postes','supervise'):''}</div>`;}
function inventoryView(){return header('Inventaire du quartier','Recherche par numéro de série, type, marque ou salle.')+`<div class="bp-filters"><div class="bp-field" style="flex-basis:100%"><label for="bp-query">Rechercher un matériel</label><div class="bp-search">${icon('search')}<input id="bp-query" placeholder="Numéro de série, identifiant ou modèle…" value="${esc(state.query)}"></div></div>${field('Type','bp-type',['Tous','Poste','Écran','Vidéoprojecteur'],state.type)}${field('Marque','bp-brand',['Toutes','Dell','HP','Lenovo','Epson'],state.brand)}${field('Salle','bp-asset-room',['Toutes',...rooms.map(r=>r.name)],state.assetRoom)}</div><div class="bp-small" id="bp-result-count" aria-live="polite"></div><div id="bp-inventory-table"></div>`;}
function drawInventory(){const q=state.query.toLowerCase(),aa=assets.filter(a=>(a.sn+' '+a.id+' '+a.name).toLowerCase().includes(q)&&(state.type==='Tous'||a.type===state.type)&&(state.brand==='Toutes'||a.brand===state.brand)&&(state.assetRoom==='Toutes'||roomOf(a.room).name===state.assetRoom));root.querySelector('#bp-result-count').textContent=`${aa.length} matériel${aa.length>1?'s':''}`;root.querySelector('#bp-inventory-table').innerHTML=assetTable(aa);}
function feedbackList(ff){return ff.length?`<div class="bp-panel">${ff.map(f=>`<div class="bp-process"><div><strong>${esc(f.asset)} · ${esc(roomOf(f.room).name)}</strong><p style="margin:4px 0">${esc(f.text)}</p><div class="bp-small">${esc(f.author)} · ${f.date} · Destinataire : administrateur</div></div><div>${badge(f.status,f.status==='À traiter'?'bp-warning':'bp-good')}${isAdmin()&&f.status==='À traiter'?`<div style="margin-top:7px">${button('Marquer traité','resolve','',`data-id="${f.id}"`)}</div>`:''}</div></div>`).join('')}</div>`:'<div class="bp-empty">Aucun retour pour cette salle.</div>';}
function alertsView(){return header('Alertes et retours','Les informations à traiter, avec leur salle et leur matériel.')+`<h2>Retours utilisateurs</h2>${feedbackList(state.role==='Formateur'?feedback.filter(f=>f.room==='a101'):feedback)}<div class="bp-section-label"><h2>Remplacements à anticiper</h2>${badge('Alerte à un an','bp-warning')}</div>${assetTable(assets.filter(a=>due(a)&&(state.role!=='Formateur'||a.room==='a101')))}<p class="bp-notice">Les dates de remplacement restent visibles sur chaque fiche matériel.</p>`;}
function supervisionView(){const r=roomOf(state.room==='stock'?'a101':state.room),posts=roomAssets(r.id).filter(a=>a.type==='Poste');return header('Supervision des postes',esc(r.name)+' · '+esc(r.training))+`<div class="bp-actions">${button('Changer de salle','choose-room')}</div><div class="bp-grid">${posts.map(a=>`<div class="bp-panel"><div class="bp-room-head"><h3>${a.id}</h3>${badge(a.id==='PC-002'?'À vérifier':'En ligne',a.id==='PC-002'?'bp-warning':'bp-good')}</div><p class="bp-small" style="margin-top:5px">${esc(a.name)} · 3 processus simulés</p><div class="bp-process"><span>explorer.exe</span>${badge('Autorisé','bp-good')}</div><div class="bp-process"><span>code.exe</span>${badge('Autorisé','bp-good')}</div><div class="bp-process"><span>powershell.exe</span>${badge(state.allowed?'Autorisé':'Interdit',state.allowed?'bp-good':'bp-bad')}</div></div>`).join('')}</div><div class="bp-panel"><div class="bp-room-head"><h2>Processus autorisés par le formateur</h2></div><div class="bp-process"><div><strong>powershell.exe</strong><p class="bp-small">Interdit dans la liste de base.</p></div>${button(state.allowed?'Retirer de ma liste':'Autoriser pour ma salle','allow')}</div><p class="bp-notice">${state.allowed?'Autorisé : la liste du formateur est prioritaire sur la liste d’interdiction de base.':'Interdit : sans autorisation du formateur, la règle de base s’applique.'}</p></div><p class="bp-notice">Aperçu simulé des processus et de l’état des postes.</p>`;}
function administrationView(){return header('Administration des postes','Réinitialisation à distance par image et suivi des opérations.')+`<div class="bp-filters">${field('Bâtiment','bp-building',['Tous','Bâtiment A','Bâtiment B'],state.building)}${field('Formation','bp-training',['Toutes','Formation Java','Formation Réseaux','Formation React','Stockage'],state.training)}</div><div id="bp-admin-list"></div><p class="bp-notice">Accès administrateur proposé. Les autorisations de réinitialisation restent à valider.</p>`;}
function drawAdmin(){const aa=assets.filter(a=>a.type==='Poste'&&(state.building==='Tous'||roomOf(a.room).building===state.building)&&(state.training==='Toutes'||roomOf(a.room).training===state.training));root.querySelector('#bp-admin-list').innerHTML=`<div class="bp-tablewrap"><table><thead><tr><th>Poste</th><th>Salle</th><th>Dernier retour simulé</th><th>Action</th></tr></thead><tbody>${aa.map(a=>`<tr><td>${a.id}</td><td>${esc(roomOf(a.room).name)}</td><td>${badge('Joignable','bp-good')}</td><td>${button('Réinitialiser','reset','',`data-id="${a.id}"`)}</td></tr>`).join('')||'<tr><td colspan="4" class="bp-empty">Aucun poste.</td></tr>'}</tbody></table></div><div class="bp-actions" style="margin-top:16px">${button('Réinitialiser une salle','reset-room')}</div>`;}
function statsView(){const scope=state.role==='Formateur'?rooms.filter(r=>r.id==='a101'):rooms.filter(r=>r.use==='Formation');const count=r=>roomAssets(r.id).filter(a=>a.type==='Poste').length;const total=scope.reduce((n,r)=>n+count(r),0),used=scope.filter(r=>r.occupied).reduce((n,r)=>n+count(r),0);return header('Utilisation et occupation','Exemple d’un suivi à l’instant T · valeurs fictives.')+`<div class="bp-grid"><div class="bp-panel" style="margin-top:0"><h2>Occupation des salles</h2><div class="bp-summary"><span><strong>${Math.round(scope.filter(r=>r.occupied).length/scope.length*100)} %</strong></span></div><p class="bp-small">${scope.filter(r=>r.occupied).length} salle(s) occupée(s) sur ${scope.length} salle(s) de formation</p><div class="bp-bars">${scope.map(r=>`<div><div class="bp-bar-label"><span>${esc(r.name)}</span><span>${r.occupied?'Occupée':'Disponible'}</span></div><div class="bp-track"><span style="width:${r.occupied?100:0}%"></span></div></div>`).join('')}</div></div><div class="bp-panel" style="margin-top:0"><h2>Utilisation des postes</h2><div class="bp-summary"><span><strong>${total?Math.round(used/total*100):0} %</strong></span></div><p class="bp-small">${used} postes utilisés sur ${total} en salle de formation</p><div class="bp-bars">${scope.map(r=>`<div><div class="bp-bar-label"><span>${esc(r.name)}</span><span>${r.occupied?count(r):0} / ${count(r)} utilisés</span></div><div class="bp-track"><span style="width:${r.occupied&&count(r)?100:0}%"></span></div></div>`).join('')}</div></div></div><p class="bp-notice">Proposition : distinguer une salle occupée d’un poste utilisé. Les règles de calcul et la fréquence d’actualisation sont à valider.</p>`;}
function rolesView(){return header('Rôles et droits','Droits recueillis lors de la réunion.')+`<div class="bp-tablewrap"><table><thead><tr><th>Rôle</th><th>Périmètre</th></tr></thead><tbody><tr><td>Administrateur</td><td>Tous les droits (accès root)</td></tr><tr><td>Gestionnaire</td><td>Gestion de tout le matériel</td></tr><tr><td>Formateur</td><td>Supervision de ses postes et liste des processus autorisés</td></tr><tr><td>Formateur + gestionnaire</td><td>Cumul des deux périmètres</td></tr><tr><td>Stagiaire</td><td>${badge('Droits à définir','bp-warning')}</td></tr></tbody></table></div><p class="bp-notice">Le sélecteur de rôle permet de comparer les parcours proposés. Le rôle stagiaire reste à définir.</p>`;}
function dialogView(){const d=state.dialog;let title='',body='',actions='';if(d.kind==='asset'){const a=assets.find(x=>x.id===d.id);title=a.id+' · '+a.name;body=assetStatus(a)+`<dl class="bp-detail"><dt>Numéro de série</dt><dd class="bp-mono">${a.sn}</dd><dt>Adresse MAC</dt><dd class="bp-mono">${a.mac}</dd><dt>Type / marque</dt><dd>${a.type} / ${a.brand}</dd><dt>Salle</dt><dd>${roomOf(a.room).name}</dd><dt>Remplacement</dt><dd>${date(a.due)} ${due(a)?badge('Moins d’un an','bp-warning'):''}</dd></dl>`+(canManage()?field('Affecter à une salle','bp-move-room',rooms.map(r=>r.name),roomOf(a.room).name):'');actions=button('Signaler un problème','report-asset')+(canManage()?button('Enregistrer l’affectation','save-move','bp-primary'):'');}
if(d.kind==='report'){title='Signaler un problème';const aa=roomAssets(state.room);body=`<div class="bp-field"><label for="bp-report-asset">Matériel concerné</label><select id="bp-report-asset">${aa.map(a=>`<option value="${a.id}" ${d.id===a.id?'selected':''}>${a.id} · ${a.name}</option>`).join('')}</select></div><div class="bp-field"><label for="bp-report-text">Description du problème</label><textarea id="bp-report-text" rows="4" placeholder="Décrivez ce que vous observez…"></textarea></div><p class="bp-small">Destinataire : administrateur · Visible sur la salle concernée</p><div id="bp-form-error" role="alert"></div>`;actions=button('Envoyer le retour','send-report','bp-primary');}
if(d.kind==='copy'){title='Copier la structure de la salle';body=`<p>Source : <strong>${roomOf(state.room).name}</strong></p><div class="bp-field"><label for="bp-copy-name">Nom de la nouvelle salle</label><input id="bp-copy-name" value="${roomOf(state.room).name} — copie"></div><p class="bp-small">Proposition à valider : copier la structure, sans dupliquer les numéros de série ni les adresses MAC.</p><div id="bp-form-error" role="alert"></div>`;actions=button('Créer la copie','save-copy','bp-primary');}
if(d.kind==='import'){title='Importer une salle';body=`<p>Aperçu avant validation</p><div class="bp-panel"><h3>Salle B202</h3><p class="bp-small">Bâtiment B · Jeu d’essai</p><div class="bp-process"><span>HP ProDesk · HP-DEMO-008</span>${badge('Série unique','bp-good')}</div><div class="bp-process"><span>HP E24 · HP-DEMO-009</span>${badge('Série unique','bp-good')}</div></div><p class="bp-notice">Exemple de contrôle avant import. Le format du fichier et les règles de validation restent à définir.</p>`;actions=button('Simuler l’import','confirm-import','bp-primary');}
if(d.kind==='export'){title='Exporter la salle';body=`<p>${roomOf(state.room).name} · ${roomAssets(state.room).length} matériels</p>${assetTable(roomAssets(state.room),false)}<p class="bp-notice">Aperçu des données exportables. Format à valider lors du cadrage.</p>`;actions=button('Fermer l’aperçu','close','bp-primary');}
if(d.kind==='choose-room'){title='Choisir une salle à superviser';body=`<div class="bp-rooms">${visibleRooms().filter(r=>r.use==='Formation').map(r=>button(r.name,'choose-supervision-room','',`data-id="${r.id}"`)).join('')}</div>`;}
if(d.kind==='reset-room'){title='Réinitialiser une salle';body=field('Salle concernée','bp-reset-room',rooms.filter(r=>r.use==='Formation').map(r=>r.name),roomOf(state.room).name);actions=button('Vérifier le périmètre','review-reset','bp-primary');}
if(d.kind==='reset'){title='Confirmer la réinitialisation';const ids=d.ids;body=`<div class="bp-alert">${icon('triangle-alert')}<div><strong>Les données locales des postes seront effacées.</strong><div>Vérifiez le périmètre et l’image avant de poursuivre.</div></div></div><dl class="bp-detail"><dt>Périmètre</dt><dd>${ids.map(esc).join(', ')} · ${ids.length} poste(s)</dd><dt>Image proposée</dt><dd>Master Formation v1 · exemple</dd></dl><div class="bp-field"><label for="bp-confirm-reset">Saisissez RÉINITIALISER pour confirmer</label><input id="bp-confirm-reset" autocomplete="off" placeholder="RÉINITIALISER"></div><p class="bp-small">Maquette : aucune commande ne sera envoyée à un poste.</p><div id="bp-form-error" role="alert"></div>`;actions=button('Simuler la réinitialisation','confirm-reset','bp-danger');}
return `<section class="bp-dialog" role="region" aria-label="${esc(title)}"><div class="bp-dialog-head"><h2>${esc(title)}</h2><button type="button" class="bp-close" data-action="close" aria-label="Fermer">${icon('x')}</button></div>${body}<div class="bp-actions">${button('Retour','close')}${actions}</div></section>`;}
function icons(){if(typeof lucide!=='undefined')lucide.createIcons({attrs:{width:16,height:16}});}
function render(){nav();const views={rooms:roomsView,room:roomView,inventory:inventoryView,alerts:alertsView,supervision:supervisionView,administration:administrationView,stats:statsView,roles:rolesView};main.innerHTML=(state.flash?`<div class="bp-flash" role="status">${esc(state.flash)}</div>`:'')+(state.dialog?dialogView():views[state.page]());if(!state.dialog){if(state.page==='rooms')drawRooms();if(state.page==='inventory')drawInventory();if(state.page==='administration')drawAdmin();}icons();}
function open(kind,extra={}){state.dialog={kind,...extra};state.flash='';render();main.querySelector('button')?.focus();}
function flash(text){state.dialog=null;state.flash=text;render();}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){state.page=b.dataset.page;state.dialog=null;state.flash='';render();return;}if(b.dataset.room){state.room=b.dataset.room;state.page='room';state.tab='equipment';state.flash='';render();return;}if(b.dataset.asset){open('asset',{id:b.dataset.asset});return;}if(b.dataset.tab){state.tab=b.dataset.tab;render();return;}const action=b.dataset.action;if(!action)return;
if(action==='close'){state.dialog=null;render();return;}
if(action==='all-feedback'){state.page='alerts';state.dialog=null;state.flash='';render();return;}
if(['copy','import','export','reset-room','choose-room'].includes(action)){open(action);return;}
if(action==='feedback'){state.room='a101';state.page='room';state.tab='feedback';state.dialog=null;render();return;}
if(action==='report'){open('report');return;}
if(action==='report-asset'){const a=assets.find(x=>x.id===state.dialog.id);state.room=a.room;open('report',{id:a.id});return;}
if(action==='save-move'){const a=assets.find(x=>x.id===state.dialog.id),r=rooms.find(x=>x.name===root.querySelector('#bp-move-room').value);a.room=r.id;flash(a.id+' affecté à '+r.name+' dans la maquette.');return;}
if(action==='send-report'){const txt=root.querySelector('#bp-report-text').value.trim();if(!txt){root.querySelector('#bp-form-error').textContent='Décrivez le problème avant l’envoi.';return;}const id=root.querySelector('#bp-report-asset').value;if(!id){root.querySelector('#bp-form-error').textContent='Cette salle ne contient aucun matériel.';return;}feedback.push({id:Date.now(),asset:id,room:state.room,text:txt,status:'À traiter',author:state.role,date:'01/10/2026'});state.page='room';state.tab='feedback';flash('Retour ajouté à la salle. Envoi à l’administrateur simulé.');return;}
if(action==='resolve'){feedback.find(f=>f.id===Number(b.dataset.id)).status='Traité';flash('Retour marqué comme traité dans la maquette.');return;}
if(action==='save-copy'){const name=root.querySelector('#bp-copy-name').value.trim();if(!name||rooms.some(r=>r.name.toLowerCase()===name.toLowerCase())){root.querySelector('#bp-form-error').textContent='Choisissez un nom de salle unique.';return;}const r=roomOf(state.room),id='copy-'+Date.now();rooms.push({...r,id,name,occupied:false});state.room=id;state.page='room';state.tab='equipment';flash('Structure copiée. Aucun équipement dupliqué.');return;}
if(action==='confirm-import'){if(rooms.some(r=>r.id==='b202')){flash('La salle B202 a déjà été importée dans la maquette.');return;}rooms.push({id:'b202',name:'Salle B202',building:'Bâtiment B',training:'Formation Java',use:'Formation',occupied:false});assets.push({id:'PC-008',name:'ProDesk 400',brand:'HP',type:'Poste',room:'b202',state:'Opérationnel',sn:'HP-DEMO-008',mac:'02:00:00:00:05:01',due:'2030-01-01'},{id:'EC-005',name:'E24 G5',brand:'HP',type:'Écran',room:'b202',state:'Opérationnel',sn:'HP-DEMO-009',mac:'Sans adresse MAC',due:'2030-01-01'});state.room='b202';state.page='room';state.tab='equipment';flash('Import simulé : Salle B202 et 2 matériels ajoutés.');return;}
if(action==='supervise'){state.page='supervision';render();return;}
if(action==='allow'){state.allowed=!state.allowed;render();return;}
if(action==='choose-supervision-room'){state.room=b.dataset.id;state.dialog=null;state.page='supervision';render();return;}
if(action==='reset'){open('reset',{ids:[b.dataset.id]});return;}
if(action==='review-reset'){const name=root.querySelector('#bp-reset-room').value,r=rooms.find(x=>x.name===name),ids=roomAssets(r.id).filter(a=>a.type==='Poste').map(a=>a.id);if(!ids.length){flash('Cette salle ne contient aucun poste à réinitialiser.');return;}open('reset',{ids});return;}
if(action==='confirm-reset'){if(root.querySelector('#bp-confirm-reset').value.trim().toUpperCase()!=='RÉINITIALISER'){root.querySelector('#bp-form-error').textContent='Saisissez exactement RÉINITIALISER.';return;}flash('Simulation terminée : image appliquée à '+state.dialog.ids.length+' poste(s). Aucune machine réelle modifiée.');}
});
root.addEventListener('change',e=>{const id=e.target.id;if(id==='bp-role'){state.role=e.target.value;state.page=state.role==='Formateur'?'supervision':'rooms';state.room='a101';state.building='Tous';state.training='Toutes';state.dialog=null;state.flash='';render();return;}const map={'bp-building':'building','bp-training':'training','bp-type':'type','bp-brand':'brand','bp-asset-room':'assetRoom'};if(map[id]){state[map[id]]=e.target.value;if(state.page==='rooms')drawRooms();if(state.page==='inventory')drawInventory();if(state.page==='administration')drawAdmin();}});
root.addEventListener('input',e=>{if(e.target.id==='bp-query'){state.query=e.target.value;drawInventory();}});
root.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.dialog){state.dialog=null;render();}});
render();
})();
</script>
</div>
