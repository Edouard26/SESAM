name: sesam

services:
    db:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-db_sesam}
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
            interval: 5s
            timeout: 5s
            retries: 10

    backend:
        build:
            context: ./Backend
            target: prod
        restart: unless-stopped
        environment:
            SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-db_sesam}
            SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
            SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
            APP_SECURITY_JWT_SECRET: ${APP_SECURITY_JWT_SECRET:?APP_SECURITY_JWT_SECRET requis}
            FRONT_ORIGIN: ${PUBLIC_URL:?PUBLIC_URL requis}
        depends_on:
            db:
                condition: service_healthy

    front:
        build:
            context: ./Front
            target: prod
            args:
                VITE_API_URL: ${PUBLIC_URL:?PUBLIC_URL requis}
        restart: unless-stopped
        ports:
            - "${WEB_PORT:-80}:80"
        depends_on:
            - backend

volumes:
    postgres_data:
