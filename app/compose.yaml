services:
    db:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-db_sesam}
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sesam_dev}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
            interval: 5s
            timeout: 5s
            retries: 10

    backend:
        build:
            context: ./Backend
        ports:
            - "8080:8080"
        environment:
            SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-db_sesam}
            SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
            SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-sesam_dev}
            APP_SECURITY_JWT_SECRET: ${APP_SECURITY_JWT_SECRET:-squelette-secret-key-very-long-at-least-64-characters-long-for-security}
            FRONT_ORIGIN: ${FRONT_ORIGIN:-http://localhost:${FRONT_PORT:-8081}}
        depends_on:
            db:
                condition: service_healthy

    front:
        build:
            context: ./Front
            args:
                VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
        ports:
            - "${FRONT_PORT:-8081}:80"
        depends_on:
            - backend

volumes:
    postgres_data:
